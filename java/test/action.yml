name: 'MA Java CI Test'
description: 'Java build and test flow'
inputs:
  java-version:
    description: 'The Java version to set up. Takes a whole or semver Java version.'
    required: true
    default: 17
  java-distribution:
    description: 'Java distribution.'
    required: true
    default: 'temurin'
  sentry-environment:
    description: 'Sentry environment for the release (e.g., development, staging, production)'
    required: false
    default: 'production'
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v6

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.java-distribution }}
        cache: gradle

    - name: Build and analyze
      shell: bash
      run: ./gradlew build

    # Checks if SENTRY_PROJECT exists before trying to create a release
    - name: Create Sentry Release
      if: github.event_name == 'push' && env.SENTRY_PROJECT != ''
      uses: getsentry/action-release@v3
      with:
        environment: ${{ inputs.sentry-environment }}
