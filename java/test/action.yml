name: 'MA Java CI Test'
description: 'Java build and test flow'
inputs:
  java-version:
    description: 'The Java version to set up. Takes a whole or semver Java version.'
    required: true
    default: '17'
  java-distribution:
    description: 'Java distribution.'
    required: true
    default: 'temurin'
  create-sentry-release:
    description: 'Whether to create a Sentry release as part of this CI run.'
    required: false
    default: 'false'
  sentry-environment:
    description: 'Sentry environment for the release (e.g., development, staging, production).'
    required: false
    default: 'development'
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v6

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.java-distribution }}
        cache: gradle

    - name: Build and analyze
      shell: bash
      run: ./gradlew build

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results
        path: '**/build/test-results/test/*.xml'
        if-no-files-found: ignore

    - name: Publish test results summary
      if: always()
      uses: dorny/test-reporter@v3
      with:
        name: Unit Tests
        path: '**/build/test-results/test/*.xml'
        reporter: java-junit

     # Ensure full git history is available only when creating a Sentry release
    - name: Fetch full git history for Sentry release
      if: github.event_name == 'push' && inputs.create-sentry-release == 'true'
      shell: bash
      run: |
         git fetch --prune --unshallow || git fetch --prune --tags

    - name: Create Sentry Release
      if: github.event_name == 'push' && inputs.create-sentry-release == 'true'
      uses: getsentry/action-release@v3
      with:
        environment: ${{ inputs.sentry-environment }}
